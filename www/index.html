<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crispy-octo-umbrella</title>
<style>
  :root { --bg:#0c0f11; --dim:#38454a; --fg:#cfcabb; --brood:#63d6ac; --empire:#e8823f; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, "D2Coding", monospace; padding:20px; }
  main { width:max-content; max-width:100%; margin:0 auto; }
  canvas { display:block; cursor:crosshair; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #panel { display:grid; grid-template-columns:24ch 1fr; gap:0 32px; margin:16px 0; font-variant-numeric:tabular-nums; }
  #panel > div > * { margin:0; min-height:1.5em; white-space:pre; font:inherit; }
  #link { color:var(--empire); }
  #panel #unit { margin-bottom:12px; }
  #panel #ledger { min-height:6em; }
  #result { color:var(--brood); }
  #log { margin:0; min-height:9em; white-space:pre-wrap; font:inherit; border-left:1px solid var(--dim); padding-left:32px; }
  nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { font:inherit; color:var(--fg); background:none; border:1px solid var(--dim); padding:4px 12px; cursor:pointer; }
  button:hover, button:focus-visible { border-color:var(--fg); outline:none; }
  kbd { font:inherit; font-size:12px; border:1px solid var(--dim); border-bottom-width:2px; padding:0 4px; margin-left:8px; }
  #seed { margin-left:auto; }
  #bar { display:none; }
  @media (max-width:699px) {
    body { padding:8px 8px 72px; }
    main { width:auto; }
    canvas { margin:0 auto; }
    #end { display:none; }
    #bar { display:flex; position:fixed; left:0; right:0; bottom:0; gap:8px; align-items:center; padding:8px; background:var(--bg); border-top:1px solid var(--dim); font-variant-numeric:tabular-nums; }
    #aim { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #bar button { min-height:44px; padding:4px 16px; flex:none; }
    #confirm { border-color:var(--brood); color:var(--brood); }
    nav button { min-height:44px; }
  }
  @media (max-width:560px) { #panel { grid-template-columns:1fr; gap:16px 0; } #log { border-left:0; padding-left:0; } }
  #err { color:var(--empire); }
</style>
</head>
<body>
<main>
  <canvas id="screen" aria-label="전장"></canvas>
  <section id="panel">
    <div>
      <p id="status"></p>
      <p id="link" aria-label="제국 중계 링크"></p>
      <p id="unit"></p>
      <pre id="ledger"></pre>
      <p id="result"></p>
    </div>
    <pre id="log" aria-live="polite"></pre>
  </section>
  <nav>
    <button id="end">턴 종료<kbd>Space</kbd></button>
    <button id="new">새 판</button>
    <button id="export">세이브 내보내기</button>
    <button id="import">불러오기</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <span id="seed"></span>
  </nav>
  <p id="err" role="alert"></p>
  <div id="bar">
    <span id="aim"></span>
    <button id="confirm" hidden>실행</button>
    <button id="end2">턴 종료</button>
  </div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
