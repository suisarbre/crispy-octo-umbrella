<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crispy-octo-umbrella</title>
<style>
  :root { --bg:#0c0f11; --dim:#38454a; --fg:#cfcabb; --brood:#63d6ac; --brood-dim:#37725e; --empire:#e8823f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, "D2Coding", monospace; padding:16px; font-variant-numeric:tabular-nums; }
  main { width:max-content; max-width:100%; margin:0 auto; position:relative; }
  #topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--dim); border-bottom:0; padding:6px 10px; }
  #status { margin:0; white-space:pre; }
  #top-right { display:flex; gap:6px; align-items:center; }
  canvas { display:block; border:1px solid var(--dim); cursor:crosshair; touch-action:manipulation; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #panel { margin:14px 0; }
  #panel > * { margin:0; min-height:1.5em; white-space:pre; font:inherit; }
  #panel #ledger { min-height:8em; }
  #result { color:var(--brood); }
  #pop { position:absolute; z-index:10; margin:0; padding:4px 8px; white-space:pre; pointer-events:none; background:var(--bg); border:1px solid var(--fg); font-variant-numeric:tabular-nums; }
  nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, nav a, #topbar a { font:inherit; color:var(--fg); background:none; border:1px solid var(--dim); padding:4px 12px; cursor:pointer; text-decoration:none; }
  button:hover, button:focus-visible, a:hover, a:focus-visible { border-color:var(--fg); outline:none; }
  #ability[data-off], #retreat[data-off] { visibility:hidden; }
  #retreat { border-color:var(--empire); color:var(--empire); }
  kbd { font:inherit; font-size:12px; border:1px solid var(--dim); border-bottom-width:2px; padding:0 4px; margin-left:8px; }
  #seed { margin-left:auto; color:var(--dim); }
  #bar { display:none; }
  #err { color:var(--empire); }

  /* 분대 정보 토글 창 (데스크탑 오버레이 / 모바일 하단 시트) */
  #roster-modal { position:fixed; z-index:20; inset:0; background:rgba(12,15,17,0.65); display:flex; align-items:center; justify-content:center; padding:16px; }
  #roster-modal[hidden] { display:none; }
  #roster-box { width:min(400px, 100%); background:var(--bg); border:1px solid var(--fg); }
  #roster-head { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-bottom:1px solid var(--dim); }
  #roster-list { display:flex; flex-direction:column; }
  .roster-row { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-bottom:1px solid #1b2226; padding:8px 10px; }
  .roster-row:last-child { border-bottom:0; }
  .roster-row:hover { background:#141b1e; }
  .roster-row.selected { background:#132420; color:var(--brood); }
  .roster-glyph { color:var(--brood); width:1.2em; text-align:center; }
  .roster-pips { letter-spacing:1px; margin-left:auto; }
  .roster-ap { color:var(--dim); min-width:3.8em; text-align:right; }
  .roster-tag { color:var(--brood); min-width:2.5em; text-align:right; font-size:12px; }

  @media (max-width:699px) {
    body { padding:8px 8px 72px; font-size:14px; }
    main { width:auto; }
    canvas { margin:0 auto; }
    #end, kbd { display:none; }
    #ability { border-color:var(--brood); color:var(--brood); }
    #bar { display:flex; position:fixed; left:0; right:0; bottom:0; gap:8px; align-items:center; padding:8px; background:var(--bg); border-top:1px solid var(--dim); font-variant-numeric:tabular-nums; z-index:12; }
    #aim { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #bar button { min-height:44px; padding:4px 16px; flex:none; }
    #confirm { border-color:var(--brood); color:var(--brood); }
    nav button, nav a, #topbar button, #topbar a { min-height:40px; display:inline-flex; align-items:center; }
    #roster-modal { align-items:flex-end; padding:0; }
    #roster-box { width:100%; border-left:0; border-right:0; border-bottom:0; }
    .roster-row { min-height:44px; }
  }
</style>
</head>
<body>
<main>
  <header id="topbar">
    <p id="status"></p>
    <div id="top-right">
      <button id="btn-roster">분대<kbd>Tab</kbd></button>
      <a href="world.html">월드</a>
    </div>
  </header>
  <canvas id="screen" aria-label="전장"></canvas>
  <section id="panel">
    <pre id="ledger"></pre>
    <p id="result"></p>
  </section>
  <nav>
    <button id="ability" data-off><span id="ability-name"></span><kbd>B</kbd></button>
    <button id="retreat" data-off>후퇴<kbd>R</kbd></button>
    <button id="end">턴 종료<kbd>Space</kbd></button>
    <button id="new">새 판</button>
    <button id="export">세이브 내보내기</button>
    <button id="import">불러오기</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <span id="seed"></span>
  </nav>
  <p id="err" role="alert"></p>
  <pre id="pop" role="status" hidden></pre>
  <div id="bar">
    <span id="aim"></span>
    <button id="confirm" hidden>실행</button>
    <button id="end2">턴 종료</button>
  </div>
</main>

<div id="roster-modal" hidden>
  <div id="roster-box" role="dialog" aria-label="분대 현황">
    <div id="roster-head">
      <span>■ 분대 현황</span>
      <button id="roster-close">닫기<kbd>Esc</kbd></button>
    </div>
    <div id="roster-list"></div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
